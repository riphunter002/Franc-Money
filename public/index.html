<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Franc Money — Entrar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body>

  <!-- Camada de fundo: grade financeira -->
  <div class="scene" aria-hidden="true">
    <div class="scene__grid"></div>

    <!-- Gráfico de evolução de lucros: anima continuamente via auth.js -->
    <svg
      class="scene__chart"
      id="profitChart"
      viewBox="0 0 1440 500"
      preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <defs>
        <linearGradient id="chartAreaFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#d4af37" stop-opacity="0.35" />
          <stop offset="100%" stop-color="#d4af37" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="chartLineStroke" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#8a6f2a" />
          <stop offset="60%" stop-color="#f4d160" />
          <stop offset="100%" stop-color="#fff3c4" />
        </linearGradient>
      </defs>

      <path id="chartArea" class="scene__chart-area" fill="url(#chartAreaFill)" />
      <path id="chartLine" class="scene__chart-line" fill="none" stroke="url(#chartLineStroke)" />
      <circle id="chartDot" class="scene__chart-dot" r="6" />
    </svg>

    <div class="scene__glow"></div>
    <!-- As moedas são injetadas aqui via auth.js -->
    <div class="coin-field" id="coinField"></div>
  </div>

  <!-- Conteúdo principal -->
  <main class="page">
    <div class="login-card" role="region" aria-labelledby="brandTitle">

      <header class="login-card__header">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true">F</span>
          <span id="brandTitle" class="brand__name">Franc Money</span>
        </div>
        <p class="login-card__subtitle">Entre para acompanhar o seu patrimônio</p>
      </header>

      <form id="loginForm" class="login-form" novalidate>

        <div class="field">
          <label for="email" class="field__label">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            class="field__input"
            placeholder="voce@exemplo.com"
            autocomplete="email"
            required
          />
          <p class="field__error" id="emailError" role="alert"></p>
        </div>

        <div class="field">
          <div class="field__label-row">
            <label for="password" class="field__label">Senha</label>
            <button type="button" class="field__toggle" id="togglePassword" aria-pressed="false">
              Mostrar
            </button>
          </div>
          <input
            id="password"
            name="password"
            type="password"
            class="field__input"
            placeholder="Sua senha"
            autocomplete="current-password"
            required
            minlength="6"
          />
          <p class="field__error" id="passwordError" role="alert"></p>
        </div>

        <div class="login-form__row">
          <label class="checkbox">
            <input type="checkbox" id="remember" name="remember" />
            <span>Manter conectado</span>
          </label>
          <a href="#" class="link">Esqueci minha senha</a>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
          <span class="btn-primary__label">Entrar</span>
          <span class="btn-primary__spinner" aria-hidden="true"></span>
        </button>

        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
      </form>

      <footer class="login-card__footer">
        <p>Ainda não tem conta? <a href="register.html" class="link">Criar conta</a></p>
      </footer>

    </div>
  </main>

  <script src="auth.js"></script>
</body>
</html>
