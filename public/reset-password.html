<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Franc Money — Redefinir senha</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0a0e17" />
</head>
<body>

  <div class="scene" aria-hidden="true">
    <div class="scene__grid"></div>
    <div class="scene__glow"></div>
  </div>

  <main class="page">
    <div class="login-card" role="region" aria-labelledby="brandTitle">

      <header class="login-card__header">
        <div class="brand">
          <img class="brand__mark" src="logo-escudo.png" alt="" aria-hidden="true" />
          <span id="brandTitle" class="brand__name">Franc Money</span>
        </div>
        <p class="login-card__subtitle">Crie uma senha nova para a sua conta.</p>
      </header>

      <form id="resetForm" class="login-form" novalidate>

        <div class="field">
          <div class="field__label-row">
            <label for="password" class="field__label">Nova senha</label>
            <button type="button" class="field__toggle" id="togglePassword" aria-pressed="false">
              Mostrar
            </button>
          </div>
          <input
            id="password"
            name="password"
            type="password"
            class="field__input"
            placeholder="Crie uma senha"
            autocomplete="new-password"
            required
            minlength="6"
          />
          <p class="field__error" id="passwordError" role="alert"></p>
        </div>

        <div class="field">
          <label for="confirmPassword" class="field__label">Confirmar senha</label>
          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            class="field__input"
            placeholder="Repita a senha"
            autocomplete="new-password"
            required
            minlength="6"
          />
          <p class="field__error" id="confirmPasswordError" role="alert"></p>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
          <span class="btn-primary__label">Redefinir senha</span>
          <span class="btn-primary__spinner" aria-hidden="true"></span>
        </button>

        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
      </form>

      <footer class="login-card__footer">
        <p><a href="index.html" class="link">Voltar para o login</a></p>
      </footer>

    </div>
  </main>

  <script src="pwa.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
