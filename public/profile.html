<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Franc Money — Perfil</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="dashboard.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body>

  <div class="app-shell">

    <!-- Só aparece no mobile (ver dashboard.css); abre a sidebar como gaveta -->
    <header class="mobile-topbar">
      <button class="mobile-topbar__menu-btn" id="sidebarToggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" width="20" height="20">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="mobile-topbar__brand">
        <img src="logo-escudo.png" alt="" aria-hidden="true" />
        <span>Franc Money</span>
      </div>
    </header>

    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <img class="sidebar__mark" src="logo-escudo.png" alt="" aria-hidden="true" />
        <span class="sidebar__name">Franc Money</span>
      </div>

      <nav class="sidebar__nav" aria-label="Navegação principal">
        <a class="nav-item" href="dashboard.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="3" width="7" height="9" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
            <rect x="14" y="3" width="7" height="5" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
            <rect x="14" y="12" width="7" height="9" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
            <rect x="3" y="16" width="7" height="5" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
          </svg>
          Painel
        </a>
        <a class="nav-item" href="transactions.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 12h16M4 12l5-5M4 12l5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 6v12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          Transações
        </a>
        <a class="nav-item" href="categories.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 6h16M4 12h10M4 18h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          Categorias
        </a>
        <a class="nav-item" href="budgets.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 19V10M11 19V5M18 19v-7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Orçamentos
        </a>
        <a class="nav-item" href="investments.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 17l5-5 4 4 7-8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M15 8h5v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Investimentos
        </a>
        <a class="nav-item" href="import.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3v12M12 3l-4 4M12 3l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Importar
        </a>
        <a class="nav-item is-active" href="profile.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="8" r="3.3" stroke="currentColor" stroke-width="1.7"/>
            <path d="M5 20c1.2-3.8 4.2-5.5 7-5.5s5.8 1.7 7 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          Perfil
        </a>
      </nav>

      <button class="sidebar__logout" id="logoutBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" width="18" height="18">
          <path d="M15 17l5-5-5-5M20 12H9M12 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Sair
      </button>
    </aside>

    <!-- ===================== CONTEÚDO ===================== -->
    <div class="scene-dashboard" aria-hidden="true">
      <div class="scene-dashboard__grid"></div>
    </div>

    <main class="main">

      <header class="topbar">
        <div>
          <p class="topbar__eyebrow">Sua conta</p>
          <h1 class="topbar__title">Perfil</h1>
        </div>
      </header>

      <!-- Dados da conta -->
      <section class="panel panel--profile">
        <div class="panel__header">
          <h2 class="panel__title">Seus dados</h2>
        </div>

        <form id="profileForm" class="category-form" novalidate>
          <div class="modal-field category-form__field">
            <label for="profileName" class="modal-label">Nome</label>
            <input id="profileName" type="text" class="modal-input" required />
          </div>

          <div class="modal-field category-form__field">
            <label for="profileEmail" class="modal-label">E-mail</label>
            <input id="profileEmail" type="email" class="modal-input" required />
          </div>

          <button type="submit" class="btn-gold category-form__submit" id="profileSubmitBtn">
            Salvar alterações
          </button>
        </form>

        <p class="modal-error" id="profileFormError" role="alert"></p>
        <p class="form-status" id="profileFormStatus" role="status" aria-live="polite"></p>
      </section>

      <!-- Trocar senha -->
      <section class="panel panel--password">
        <div class="panel__header">
          <h2 class="panel__title">Alterar senha</h2>
        </div>

        <form id="passwordForm" class="category-form" novalidate>
          <div class="modal-field category-form__field">
            <label for="currentPassword" class="modal-label">Senha atual</label>
            <input id="currentPassword" type="password" class="modal-input" autocomplete="current-password" required />
          </div>

          <div class="modal-field category-form__field">
            <label for="newPassword" class="modal-label">Nova senha</label>
            <input id="newPassword" type="password" class="modal-input" autocomplete="new-password" minlength="6" required />
          </div>

          <div class="modal-field category-form__field">
            <label for="confirmNewPassword" class="modal-label">Confirmar nova senha</label>
            <input id="confirmNewPassword" type="password" class="modal-input" autocomplete="new-password" minlength="6" required />
          </div>

          <button type="submit" class="btn-gold category-form__submit" id="passwordSubmitBtn">
            Alterar senha
          </button>
        </form>

        <p class="modal-error" id="passwordFormError" role="alert"></p>
        <p class="form-status" id="passwordFormStatus" role="status" aria-live="polite"></p>
      </section>

    </main>
  </div>

  <script src="session.js"></script>
  <script src="profile.js"></script>
</body>
</html>
