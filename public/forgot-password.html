<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Franc Money — Esqueci minha senha</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body>

  <!-- Fundo simples (sem a animação de moedas/gráfico do login — é só uma
       tela de utilidade, não precisa do mesmo espetáculo visual) -->
  <div class="scene" aria-hidden="true">
    <div class="scene__grid"></div>
    <div class="scene__glow"></div>
  </div>

  <main class="page">
    <div class="login-card" role="region" aria-labelledby="brandTitle">

      <header class="login-card__header">
        <div class="brand">
          <img class="brand__mark" src="logo-escudo.png" alt="" aria-hidden="true" />
          <span id="brandTitle" class="brand__name">Franc Money</span>
        </div>
        <p class="login-card__subtitle">
          Informe o e-mail da sua conta e vamos gerar um link pra você criar uma senha nova.
        </p>
      </header>

      <form id="forgotForm" class="login-form" novalidate>

        <div class="field">
          <label for="email" class="field__label">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            class="field__input"
            placeholder="voce@exemplo.com"
            autocomplete="email"
            required
          />
          <p class="field__error" id="emailError" role="alert"></p>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
          <span class="btn-primary__label">Gerar link de redefinição</span>
          <span class="btn-primary__spinner" aria-hidden="true"></span>
        </button>

        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>

        <!-- Aparece só depois de gerar o link (versão local, sem envio de
             e-mail: o link fica aqui na tela mesmo) -->
        <div class="field" id="resetLinkField" hidden>
          <label for="resetLinkOutput" class="field__label">Seu link de redefinição</label>
          <input id="resetLinkOutput" type="text" class="field__input" readonly />
          <p class="field__error" style="color: var(--text-secondary);" id="resetLinkHint"></p>
        </div>
      </form>

      <footer class="login-card__footer">
        <p><a href="index.html" class="link">Voltar para o login</a></p>
      </footer>

    </div>
  </main>

  <script src="forgot-password.js"></script>
</body>
</html>
