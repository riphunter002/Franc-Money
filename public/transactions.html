<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Franc Money — Transações</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="dashboard.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body>

  <div class="app-shell">

    <!-- Só aparece no mobile (ver dashboard.css); abre a sidebar como gaveta -->
    <header class="mobile-topbar">
      <button class="mobile-topbar__menu-btn" id="sidebarToggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" width="20" height="20">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="mobile-topbar__brand">
        <img src="logo-escudo.png" alt="" aria-hidden="true" />
        <span>Franc Money</span>
      </div>
    </header>

    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <img class="sidebar__mark" src="logo-escudo.png" alt="" aria-hidden="true" />
        <span class="sidebar__name">Franc Money</span>
      </div>

      <nav class="sidebar__nav" aria-label="Navegação principal">
        <a class="nav-item" href="dashboard.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="3" width="7" height="9" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
            <rect x="14" y="3" width="7" height="5" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
            <rect x="14" y="12" width="7" height="9" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
            <rect x="3" y="16" width="7" height="5" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
          </svg>
          Painel
        </a>
        <a class="nav-item is-active" href="transactions.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 12h16M4 12l5-5M4 12l5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 6v12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          Transações
        </a>
        <a class="nav-item" href="categories.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 6h16M4 12h10M4 18h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          Categorias
        </a>
        <a class="nav-item" href="budgets.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 19V10M11 19V5M18 19v-7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Orçamentos
        </a>
        <a class="nav-item" href="investments.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 17l5-5 4 4 7-8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M15 8h5v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Investimentos
        </a>
        <a class="nav-item" href="import.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3v12M12 3l-4 4M12 3l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Importar
        </a>
      </nav>

      <button class="sidebar__logout" id="logoutBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" width="18" height="18">
          <path d="M15 17l5-5-5-5M20 12H9M12 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Sair
      </button>
    </aside>

    <!-- ===================== CONTEÚDO ===================== -->
    <div class="scene-dashboard" aria-hidden="true">
      <div class="scene-dashboard__grid"></div>
    </div>

    <main class="main">

      <header class="topbar">
        <div>
          <p class="topbar__eyebrow">Todo o seu histórico</p>
          <h1 class="topbar__title">Transações</h1>
        </div>
        <button class="btn-gold" id="newTransactionBtn" type="button">
          + Nova transação
        </button>
      </header>

      <!-- Filtros -->
      <section class="panel panel--filters">
        <form id="filtersForm" class="filters-form">
          <div class="modal-field filters-form__field">
            <label for="filterType" class="modal-label">Tipo</label>
            <select id="filterType" class="modal-input">
              <option value="">Todos</option>
              <option value="INCOME">Receitas</option>
              <option value="EXPENSE">Despesas</option>
            </select>
          </div>

          <div class="modal-field filters-form__field">
            <label for="filterStartDate" class="modal-label">De</label>
            <input id="filterStartDate" type="date" class="modal-input" />
          </div>

          <div class="modal-field filters-form__field">
            <label for="filterEndDate" class="modal-label">Até</label>
            <input id="filterEndDate" type="date" class="modal-input" />
          </div>

          <div class="filters-form__actions">
            <button type="submit" class="btn-gold">Filtrar</button>
            <button type="button" class="btn-secondary" id="clearFiltersBtn">Limpar</button>
          </div>
        </form>
      </section>

      <!-- Tabela -->
      <section class="panel panel--transactions">
        <table class="transactions-table">
          <thead>
            <tr>
              <th scope="col">Descrição</th>
              <th scope="col">Categoria</th>
              <th scope="col">Data</th>
              <th scope="col" class="align-right">Valor</th>
              <th scope="col" class="align-right">Ações</th>
            </tr>
          </thead>
          <tbody id="transactionsBody">
            <!-- Preenchido dinamicamente por transactions.js -->
          </tbody>
        </table>

        <div class="pagination" id="pagination">
          <button type="button" class="pagination__btn" id="prevPageBtn">← Anterior</button>
          <span class="pagination__info" id="paginationInfo">Página 1 de 1</span>
          <button type="button" class="pagination__btn" id="nextPageBtn">Próxima →</button>
        </div>
      </section>

    </main>

    <!-- ===================== MODAL: NOVA/EDITAR TRANSAÇÃO ===================== -->
    <div class="modal-overlay" id="txModalOverlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="txModalTitle">
        <div class="modal__header">
          <h2 id="txModalTitle" class="modal__title">Nova transação</h2>
          <button type="button" class="modal__close" id="txModalClose" aria-label="Fechar">
            &times;
          </button>
        </div>

        <form id="txForm" class="modal-form" novalidate>
          <input type="hidden" id="txId" value="" />

          <fieldset class="type-toggle">
            <legend class="modal-label">Tipo</legend>
            <label class="type-toggle__option">
              <input type="radio" name="txType" value="INCOME" checked />
              <span>Receita</span>
            </label>
            <label class="type-toggle__option">
              <input type="radio" name="txType" value="EXPENSE" />
              <span>Despesa</span>
            </label>
          </fieldset>

          <div class="modal-field">
            <label for="txTitle" class="modal-label">Título</label>
            <input
              id="txTitle"
              name="title"
              type="text"
              class="modal-input"
              placeholder="Ex.: Salário, Supermercado..."
              required
            />
          </div>

          <div class="modal-field">
            <label for="txAmount" class="modal-label">Valor (R$)</label>
            <input
              id="txAmount"
              name="amount"
              type="number"
              class="modal-input"
              placeholder="0,00"
              min="0.01"
              step="0.01"
              inputmode="decimal"
              required
            />
          </div>

          <div class="modal-field">
            <label for="txDate" class="modal-label">Data</label>
            <input id="txDate" name="date" type="date" class="modal-input" required />
          </div>

          <div class="modal-field">
            <label for="txCategory" class="modal-label">Categoria (opcional)</label>
            <select id="txCategory" name="category_id" class="modal-input">
              <option value="">Sem categoria</option>
            </select>
          </div>

          <div class="modal-field">
            <label for="txDescription" class="modal-label">Descrição (opcional)</label>
            <textarea
              id="txDescription"
              name="description"
              class="modal-input modal-textarea"
              rows="2"
              placeholder="Detalhes adicionais"
            ></textarea>
          </div>

          <p class="modal-error" id="txFormError" role="alert"></p>

          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="txCancelBtn">Cancelar</button>
            <button type="submit" class="btn-gold" id="txSubmitBtn">Salvar transação</button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <script src="session.js"></script>
  <script src="transactions.js"></script>
</body>
</html>
