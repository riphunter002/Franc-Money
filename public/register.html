<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Franc Money — Criar conta</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Base compartilhada com o login (cartão, campos, botão...) -->
  <link rel="stylesheet" href="style.css" />
  <!-- Só o que é diferente aqui: comemoração de boas-vindas -->
  <link rel="stylesheet" href="register.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0a0e17" />
</head>
<body>

  <!-- Camada de fundo: grade financeira + fogos de artifício -->
  <div class="scene scene--register" aria-hidden="true">
    <div class="scene__grid"></div>
    <div class="scene__glow scene__glow--register"></div>
    <!-- Foguetes e explosões são injetados aqui via register.js -->
    <div class="fireworks-field" id="fireworksField"></div>
  </div>

  <!-- Conteúdo principal -->
  <main class="page">
    <div class="login-card register-card" role="region" aria-labelledby="brandTitle">

      <header class="login-card__header">
        <div class="brand">
          <img class="brand__mark" src="logo-escudo.png" alt="" aria-hidden="true" />
          <span id="brandTitle" class="brand__name">Franc Money</span>
        </div>
        <p class="login-card__subtitle">
          Bem-vindo(a)! Crie sua conta e comece a organizar suas finanças.
        </p>
      </header>

      <form id="registerForm" class="login-form" novalidate>

        <div class="field">
          <label for="name" class="field__label">Nome</label>
          <input
            id="name"
            name="name"
            type="text"
            class="field__input"
            placeholder="Como podemos te chamar?"
            autocomplete="name"
            required
          />
          <p class="field__error" id="nameError" role="alert"></p>
        </div>

        <div class="field">
          <label for="email" class="field__label">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            class="field__input"
            placeholder="voce@exemplo.com"
            autocomplete="email"
            required
          />
          <p class="field__error" id="emailError" role="alert"></p>
        </div>

        <div class="field">
          <div class="field__label-row">
            <label for="password" class="field__label">Senha</label>
            <button type="button" class="field__toggle" id="togglePassword" aria-pressed="false">
              Mostrar
            </button>
          </div>
          <input
            id="password"
            name="password"
            type="password"
            class="field__input"
            placeholder="Crie uma senha"
            autocomplete="new-password"
            required
            minlength="6"
          />
          <p class="field__error" id="passwordError" role="alert"></p>
        </div>

        <div class="field">
          <label for="confirmPassword" class="field__label">Confirmar senha</label>
          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            class="field__input"
            placeholder="Repita a senha"
            autocomplete="new-password"
            required
            minlength="6"
          />
          <p class="field__error" id="confirmPasswordError" role="alert"></p>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
          <span class="btn-primary__label">Criar conta</span>
          <span class="btn-primary__spinner" aria-hidden="true"></span>
        </button>

        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
      </form>

      <footer class="login-card__footer">
        <p>Já tem uma conta? <a href="index.html" class="link">Entrar</a></p>
      </footer>

    </div>
  </main>

  <script src="pwa.js"></script>
  <script src="register.js"></script>
</body>
</html>
