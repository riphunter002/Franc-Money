<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <script src="theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Franc Money — Configurações</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="dashboard.css?v=8" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0a0e17" />
</head>
<body>
  <a class="skip-link" href="#mainContent">Ir para o conteúdo</a>

  <div class="app-shell">

    <!-- Só aparece no mobile (ver dashboard.css); abre a sidebar como gaveta -->
    <header class="mobile-topbar">
      <button class="mobile-topbar__menu-btn" id="sidebarToggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" width="20" height="20">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="mobile-topbar__brand">
        <img src="logo-escudo.png" alt="" aria-hidden="true" />
        <span>Franc Money</span>
      </div>
      <button class="theme-toggle theme-toggle--mobile" type="button" data-theme-toggle aria-label="Ativar tema claro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span data-theme-label>Modo claro</span></button>
    </header>

    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <img class="sidebar__mark" src="logo-escudo.png" alt="" aria-hidden="true" />
        <span class="sidebar__name">Franc Money</span>
      </div>

      <nav class="sidebar__nav" aria-label="Navegação principal">
        <a class="nav-item" href="dashboard.html"><svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/></svg><span>Hoje</span></a>
        <a class="nav-item" href="transactions.html"><svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/></svg><span>Movimentações</span></a>
        <a class="nav-item" href="accounts.html"><svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18m-13 5h4"/></svg><span>Contas e cartões</span></a>
        <a class="nav-item" href="budgets.html"><svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4m8-4v4M4 11h16"/></svg><span>Planejamento</span></a>
        <a class="nav-item" href="investments.html"><svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10m6 10V5m6 15v-8m5 8V3"/></svg><span>Patrimônio</span></a>
        <p class="nav-caption">ORGANIZAR</p>
        <a class="nav-item" href="categories.html"><svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h12M4 18h8"/></svg><span>Categorias</span></a>
        <a class="nav-item" href="import.html"><svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/></svg><span>Importar arquivo</span></a>
      </nav>

      <div class="sidebar__footer"><a class="nav-item is-active" href="profile.html" aria-current="page"><svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 3-1 3-3 1 1 3-2 2 2 2-1 3 3 1 1 3h6l1-3 3-1-1-3 2-2-2-2 1-3-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg><span>Configurações</span></a><button class="theme-toggle" type="button" data-theme-toggle aria-label="Ativar tema claro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span data-theme-label>Modo claro</span></button>
      <button class="sidebar__logout" id="logoutBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" width="18" height="18">
          <path d="M15 17l5-5-5-5M20 12H9M12 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Sair
      </button>
      </div>
    </aside>

    <!-- ===================== CONTEÚDO ===================== -->
    <div class="scene-dashboard" aria-hidden="true">
      <div class="scene-dashboard__grid"></div>
    </div>

    <main class="main" id="mainContent">

      <header class="topbar">
        <div>
          <p class="topbar__eyebrow">Sua conta</p>
          <h1 class="topbar__title">Configurações</h1>
        </div>
      </header>

      <!-- Dados da conta -->
      <section class="panel panel--profile">
        <div class="panel__header">
          <h2 class="panel__title">Seus dados</h2>
        </div>

        <form id="profileForm" class="category-form" novalidate>
          <div class="modal-field category-form__field">
            <label for="profileName" class="modal-label">Nome</label>
            <input id="profileName" type="text" class="modal-input" required />
          </div>

          <div class="modal-field category-form__field">
            <label for="profileEmail" class="modal-label">E-mail</label>
            <input id="profileEmail" type="email" class="modal-input" required />
          </div>

          <button type="submit" class="btn-gold category-form__submit" id="profileSubmitBtn">
            Salvar alterações
          </button>
        </form>

        <p class="modal-error" id="profileFormError" role="alert"></p>
        <p class="form-status" id="profileFormStatus" role="status" aria-live="polite"></p>
      </section>

      <!-- Trocar senha -->
      <section class="panel panel--password">
        <div class="panel__header">
          <h2 class="panel__title">Alterar senha</h2>
        </div>

        <form id="passwordForm" class="category-form" novalidate>
          <div class="modal-field category-form__field">
            <label for="currentPassword" class="modal-label">Senha atual</label>
            <input id="currentPassword" type="password" class="modal-input" autocomplete="current-password" required />
          </div>

          <div class="modal-field category-form__field">
            <label for="newPassword" class="modal-label">Nova senha</label>
            <input id="newPassword" type="password" class="modal-input" autocomplete="new-password" minlength="6" required />
          </div>

          <div class="modal-field category-form__field">
            <label for="confirmNewPassword" class="modal-label">Confirmar nova senha</label>
            <input id="confirmNewPassword" type="password" class="modal-input" autocomplete="new-password" minlength="6" required />
          </div>

          <button type="submit" class="btn-gold category-form__submit" id="passwordSubmitBtn">
            Alterar senha
          </button>
        </form>

        <p class="modal-error" id="passwordFormError" role="alert"></p>
        <p class="form-status" id="passwordFormStatus" role="status" aria-live="polite"></p>
      </section>

    </main>
  </div>

  <script src="pwa.js"></script>
  <script src="session.js?v=8"></script>
  <script src="profile.js"></script>
</body>
</html>
