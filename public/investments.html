<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Franc Money — Investimentos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="dashboard.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body>

  <div class="app-shell">

    <!-- Só aparece no mobile (ver dashboard.css); abre a sidebar como gaveta -->
    <header class="mobile-topbar">
      <button class="mobile-topbar__menu-btn" id="sidebarToggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" width="20" height="20">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="mobile-topbar__brand">
        <img src="logo-escudo.png" alt="" aria-hidden="true" />
        <span>Franc Money</span>
      </div>
    </header>

    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <img class="sidebar__mark" src="logo-escudo.png" alt="" aria-hidden="true" />
        <span class="sidebar__name">Franc Money</span>
      </div>

      <nav class="sidebar__nav" aria-label="Navegação principal">
        <a class="nav-item" href="dashboard.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="3" width="7" height="9" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
            <rect x="14" y="3" width="7" height="5" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
            <rect x="14" y="12" width="7" height="9" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
            <rect x="3" y="16" width="7" height="5" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
          </svg>
          Painel
        </a>
        <a class="nav-item" href="transactions.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 12h16M4 12l5-5M4 12l5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 6v12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          Transações
        </a>
        <a class="nav-item" href="categories.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 6h16M4 12h10M4 18h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          Categorias
        </a>
        <a class="nav-item" href="budgets.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 19V10M11 19V5M18 19v-7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Orçamentos
        </a>
        <a class="nav-item is-active" href="investments.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 17l5-5 4 4 7-8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M15 8h5v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Investimentos
        </a>
        <a class="nav-item" href="import.html">
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3v12M12 3l-4 4M12 3l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Importar
        </a>
      </nav>

      <button class="sidebar__logout" id="logoutBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" width="18" height="18">
          <path d="M15 17l5-5-5-5M20 12H9M12 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Sair
      </button>
    </aside>

    <!-- ===================== CONTEÚDO ===================== -->
    <div class="scene-dashboard" aria-hidden="true">
      <div class="scene-dashboard__grid"></div>
    </div>

    <main class="main">

      <header class="topbar">
        <div>
          <p class="topbar__eyebrow">Planeje o futuro</p>
          <h1 class="topbar__title">Investimentos</h1>
        </div>
      </header>

      <!-- Formulário de simulação -->
      <section class="panel panel--investment-form">
        <div class="panel__header">
          <h2 class="panel__title">Simulação de juros compostos</h2>
        </div>

        <form id="investmentForm" class="investment-form" novalidate>
          <div class="modal-field investment-form__field">
            <label for="invInitial" class="modal-label">Valor inicial (R$)</label>
            <input id="invInitial" type="number" class="modal-input" min="0" step="0.01" value="1000" />
          </div>

          <div class="modal-field investment-form__field">
            <label for="invMonthly" class="modal-label">Aporte mensal (R$)</label>
            <input id="invMonthly" type="number" class="modal-input" min="0" step="0.01" value="200" />
          </div>

          <div class="modal-field investment-form__field">
            <label for="invRate" class="modal-label">Taxa de juros (% ao mês)</label>
            <input id="invRate" type="number" class="modal-input" min="0" step="0.01" value="0.7" />
            <p class="modal-hint" id="invRateHint"></p>
          </div>

          <div class="modal-field investment-form__field">
            <label for="invYears" class="modal-label">Período (anos)</label>
            <input id="invYears" type="number" class="modal-input" min="1" step="1" value="10" />
          </div>
        </form>
      </section>

      <!-- Resultado da simulação -->
      <section class="summary-grid" aria-label="Resultado da simulação">
        <div class="summary-card summary-card--balance">
          <p class="summary-card__label">Valor final</p>
          <p class="summary-card__value" id="invFinalValue">R$ 0,00</p>
          <p class="summary-card__hint" id="invFinalHint"></p>
        </div>

        <div class="summary-card">
          <p class="summary-card__label">Total investido</p>
          <p class="summary-card__value" id="invTotalInvested">R$ 0,00</p>
        </div>

        <div class="summary-card">
          <div class="summary-card__icon summary-card__icon--income" aria-hidden="true">↑</div>
          <p class="summary-card__label">Total em juros</p>
          <p class="summary-card__value summary-card__value--income" id="invTotalInterest">R$ 0,00</p>
        </div>
      </section>

      <!-- Gráfico de evolução -->
      <section class="panel panel--chart">
        <div class="panel__header">
          <h2 class="panel__title">Evolução do investimento</h2>
        </div>

        <div class="chart-legend" id="invLegend">
          <span class="chart-legend__item">
            <span class="chart-legend__swatch chart-legend__swatch--solid"></span>
            Valor total
          </span>
          <span class="chart-legend__item">
            <span class="chart-legend__swatch chart-legend__swatch--dashed"></span>
            Total investido
          </span>
        </div>

        <svg class="trend-chart" id="invChart" viewBox="0 0 600 220" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="invFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#d4af37" stop-opacity="0.32" />
              <stop offset="100%" stop-color="#d4af37" stop-opacity="0" />
            </linearGradient>
          </defs>
          <path id="invArea" fill="url(#invFill)" />
          <path id="invInvestedLine" fill="none" stroke="#8b93a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" />
          <path id="invValueLine" fill="none" stroke="#f4d160" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div class="trend-chart__labels" id="invChartLabels"></div>
      </section>

    </main>
  </div>

  <script src="session.js"></script>
  <script src="investments.js"></script>
</body>
</html>
